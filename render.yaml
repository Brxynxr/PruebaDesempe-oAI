services:
  # 1. Backend FastAPI Service (Always-On para mantener WebSockets y Telegram Poller)
  - type: web
    name: academia-lumina-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumina-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_API_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://academia-lumina-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://academia-lumina-frontend.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # 2. Frontend React (Static Site gratuito)
  - type: web
    name: academia-lumina-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://academia-lumina-backend.onrender.com
      - key: VITE_BACKEND_API_KEY
        fromService:
          type: web
          name: academia-lumina-backend
          envVarKey: BACKEND_API_KEY

databases:
  # 3. Base de Datos PostgreSQL Gestionada en Render
  - name: lumina-postgres
    databaseName: lumina_db
    user: lumina_user
    plan: free
